name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lightwms_test
          POSTGRES_USER: lightwms
          POSTGRES_PASSWORD: lightwms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightwms -d lightwms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://lightwms:lightwms_test_password@127.0.0.1:5432/lightwms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pytest --junitxml=pytest-results.xml
          status=$?
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('pytest-results.xml')
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  problem = case.find('failure') or case.find('error')
                  if problem is None:
                      continue
                  name = f"{case.get('classname', '')}.{case.get('name', '')}".strip('.')
                  message = problem.get('message') or (problem.text or '').strip()
                  message = re.sub(r'\s+', ' ', message)[:4000]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error title=pytest {name}::{message}")
          PY
          exit "$status"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend source integrity
        run: |
          test -d src/lib || (echo "ERROR: frontend/src/lib is missing from Git. Check root .gitignore and restore the source directory." && exit 1)
          test -f src/lib/utils.ts || (echo "ERROR: frontend/src/lib/utils.ts is missing." && exit 1)
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        run: npm run build:ci
