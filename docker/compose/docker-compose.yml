version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lightwms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightwms}
      POSTGRES_USER: ${POSTGRES_USER:-lightwms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightwms_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightwms} -d ${POSTGRES_DB:-lightwms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - lightwms-network

  redis:
    image: redis:7-alpine
    container_name: lightwms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lightwms-network

  web:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: lightwms-web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-lightwms}
      - POSTGRES_USER=${POSTGRES_USER:-lightwms}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lightwms_secret}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/var/log/lightwms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lightwms-network

  nginx:
    image: nginx:alpine
    container_name: lightwms-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
      - nginx_logs:/var/log/nginx
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - lightwms-network

  backup:
    image: postgres:15-alpine
    container_name: lightwms-backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightwms}
      POSTGRES_USER: ${POSTGRES_USER:-lightwms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightwms_secret}
      POSTGRES_HOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-lightwms_secret}
    volumes:
      - ../scripts:/scripts:ro
      - ../backup/crontab:/etc/crontabs/root:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c", "crond -f -l 2"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lightwms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  logs_data:
    driver: local
  nginx_logs:
    driver: local
  backup_data:
    driver: local

networks:
  lightwms-network:
    driver: bridge
