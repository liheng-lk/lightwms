# LightWMS DockerHub 镜像部署配置
# 使用预构建的 DockerHub 镜像进行部署测试
#
# 使用方法:
#   在仓库根目录运行:
#   docker-compose -f docker/compose/docker-compose.dockerhub.yml up -d
#
# 生产使用前请在根目录 .env 中至少设置 SECRET_KEY 和 POSTGRES_PASSWORD。
# 外部域名/穿透只应指向 Nginx 的 HTTP_PORT（默认 80），不要直接代理 frontend:3000。

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lightwms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightwms}
      POSTGRES_USER: ${POSTGRES_USER:-lightwms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightwms} -d ${POSTGRES_DB:-lightwms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lightwms-network

  redis:
    image: redis:7-alpine
    container_name: lightwms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lightwms-network

  backend:
    image: liheng6668/lightwms-backend:latest
    container_name: lightwms-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEBUG=False
      - POSTGRES_DB=${POSTGRES_DB:-lightwms}
      - POSTGRES_USER=${POSTGRES_USER:-lightwms}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lightwms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: liheng6668/lightwms-frontend:latest
    container_name: lightwms-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lightwms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: lightwms-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../config/nginx-split.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lightwms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  lightwms-network:
    driver: bridge
