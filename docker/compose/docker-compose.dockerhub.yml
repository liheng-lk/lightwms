# LightWMS DockerHub 镜像部署配置
#
# 本地/局域网访问模型：浏览器 -> IP:${HTTP_PORT:-3000} -> Next.js frontend
# frontend 在服务端通过 Docker 内网访问 backend:8000。
# 不再额外启动 Nginx，也不再把宿主机端口映射到容器 80 端口。

services:
  db:
    image: postgres:15-alpine
    container_name: lightwms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightwms}
      POSTGRES_USER: ${POSTGRES_USER:-lightwms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightwms} -d ${POSTGRES_DB:-lightwms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lightwms-network

  redis:
    image: redis:7-alpine
    container_name: lightwms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lightwms-network

  backend:
    image: liheng6668/lightwms-backend:${LIGHTWMS_VERSION:-latest}
    container_name: lightwms-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEBUG=False
      - POSTGRES_DB=${POSTGRES_DB:-lightwms}
      - POSTGRES_USER=${POSTGRES_USER:-lightwms}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - WECHAT_ALLOWED_REDIRECT_URIS=${WECHAT_ALLOWED_REDIRECT_URIS:-http://localhost:3000/auth/wechat/callback}
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lightwms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: liheng6668/lightwms-frontend:${LIGHTWMS_VERSION:-latest}
    container_name: lightwms-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8000
      # 本地 IP:端口 默认走 HTTP，因此默认不能写 Secure cookie。
      # 如果你明确通过 HTTPS 访问，再设置 SECURE_COOKIES=true。
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lightwms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local

networks:
  lightwms-network:
    driver: bridge
