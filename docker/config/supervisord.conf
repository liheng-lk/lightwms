[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
startsecs=5
startretries=3
stdout_logfile=/var/log/nginx/stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/nginx/stderr.log
stderr_logfile_maxbytes=10MB
stopwaitsecs=10
stopsignal=QUIT

[program:gunicorn]
command=/usr/local/bin/gunicorn config.wsgi:application 
    --bind 127.0.0.1:8000 
    --workers 4 
    --threads 2 
    --timeout 120 
    --graceful-timeout 30
    --keep-alive 5
    --max-requests 1000
    --max-requests-jitter 50
    --access-logfile /var/log/lightwms/gunicorn_access.log
    --error-logfile /var/log/lightwms/gunicorn_error.log
    --capture-output
directory=/app/backend
user=appuser
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/var/log/lightwms/gunicorn.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/var/log/lightwms/gunicorn_error.log
stderr_logfile_maxbytes=50MB
stopwaitsecs=30
stopsignal=TERM
environment=DJANGO_SETTINGS_MODULE="config.settings.production"

[program:nextjs]
command=/usr/bin/node server.js
directory=/app/frontend
user=appuser
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/var/log/lightwms/nextjs.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/var/log/lightwms/nextjs_error.log
stderr_logfile_maxbytes=50MB
stopwaitsecs=10
stopsignal=TERM
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",BACKEND_URL="http://127.0.0.1:8000"

[group:lightwms]
programs=nginx,gunicorn,nextjs
priority=999
